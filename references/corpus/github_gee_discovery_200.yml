source: GitHub Search API
queries:
- name: gee_topic
  query: topic:google-earth-engine archived:false fork:false
  query_url: https://api.github.com/search/repositories?q=topic%3Agoogle-earth-engine+archived%3Afalse+fork%3Afalse&sort=stars&order=desc&per_page=100&page=1
  requested_limit: 220
  returned_count: 220
  total_count_reported: 678
- name: paper_linkage
  query: '"Google Earth Engine" DOI in:readme archived:false fork:false'
  query_url: https://api.github.com/search/repositories?q=%22Google+Earth+Engine%22+DOI+in%3Areadme+archived%3Afalse+fork%3Afalse&sort=stars&order=desc&per_page=100&page=1
  requested_limit: 80
  returned_count: 80
  total_count_reported: 1932
- name: research_workflow
  query: '"Google Earth Engine" research in:readme archived:false fork:false'
  query_url: https://api.github.com/search/repositories?q=%22Google+Earth+Engine%22+research+in%3Areadme+archived%3Afalse+fork%3Afalse&sort=stars&order=desc&per_page=100&page=1
  requested_limit: 80
  returned_count: 80
  total_count_reported: 5720
purpose: Quality-screened 200-repository discovery inventory for pattern-only GEE
  corpus exams, data-usage review, and paper-linkage review. Do not copy third-party
  code.
snapshot_summary:
  repository_count: 200
  direct_domain_evidence_count: 200
  high_signal_metadata_count: 89
  qualified_metadata_candidate_count: 111
  declared_license_count: 152
  license_noassertion_count: 48
quality_policy:
  minimum_score: 4
  excluded:
  - archived
  - fork
  domain_relevance_required: direct_metadata_evidence
  search_lane_only_matches_are_excluded: true
  paper_candidate_floor: 20
  paper_candidate_count: 44
  review_boundary: Metadata quality screening is not repository, code, data, or paper
    review.
  data_contract_required_before_promotion:
  - dataset_id_and_version
  - bands_or_variables
  - scale_factor_and_offset
  - qa_and_mask_policy
  - spatial_grid_projection_and_resampling
  - temporal_coverage_and_cadence
  - access_license_and_asset_stability
  - private_asset_dependency
boundary:
  seed_inventory: references/corpus/github_gee_seed_repos.yml remains the 30-50 reviewed
    candidate set.
  discovery_inventory: This file is metadata-only and does not imply code, data, or
    paper review approval.
  review_overlay: Deep-review decisions are recorded separately in references/corpus/github_gee_reviewed_batch_01.yml;
    discovery records retain their snapshot-level quality_screened_unreviewed state.
  promotion_rule: Promote only factual/operator patterns after license, provenance,
    and official-doc compatibility review.
