schema_version: gee-corpus-reviewed/v0.1
reviewed_at: '2026-07-31'
discovery_snapshot: references/corpus/github_gee_discovery_200.yml
purpose: Deep-review ledger for reusable public patterns, rejected promotions, and data-use boundaries.
review_protocol:
  minimum_surfaces: README plus license, and one relevant implementation or method surface when a pattern is promoted.
  paper_rule: A paper link is verified against a DOI, publisher, or journal page before it supports a pattern.
  data_rule: Every record reviews identity, variables, scaling, QA, grid, temporal scope, access, and private dependencies; unknown remains explicit.
  promotion_rule: Important findings must map to a source-backed evidence card or regression rule. General findings remain searchable but non-blocking.
  ignorance_rule: Checked public surfaces do not authorize inference about private assets, unpublished settings, credentials, or unreviewed files.
progress:
  discovery_inventory_total: 200
  discovery_records_reviewed: 21
  discovery_records_remaining: 179
  additional_anchor_records_reviewed: 3
  total_deep_review_records: 24
  reviewed_pattern_sources: 17
  reviewed_no_new_promotion: 7
