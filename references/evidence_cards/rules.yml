- card_id: sentinel1_flood_mapping_rule
  title: Sentinel-1 flood mapping rule
  source_id: gee-catalog-sentinel1-grd
  source_url: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_S1_GRD
  source_type: official_data_catalog
  trust_tier: A
  allowed_use: summary_only
  topics:
  - Sentinel-1
  - flood_mapping
  - SAR
  - validator_rule
  extracted_facts:
  - COPERNICUS/S1_GRD is the official Earth Engine dataset ID for Sentinel-1 SAR flood and change workflows.
  extracted_patterns:
  - Flood mapping plans should use before/after date windows, AOI filtering, IW mode, polarization/orbit filters, and an explicit change metric.
  limitations:
  - SAR threshold maps are screening products and need independent evidence before impact or ground-truth claims.
  - Speckle, incidence angle, polarization, orbit direction, permanent water, and land-cover context can affect interpretation.
  claim_boundaries:
  - Sentinel-1 flood maps support candidate flood/change screening unless validated with independent reference evidence.
  applicable_workflows:
  - flood_mapping
  - change_detection
  applicable_datasets:
  - COPERNICUS/S1_GRD
  applicable_operators:
  - filterDate
  - filterBounds
  - filterMetadata
  - divide
  - subtract
  - threshold
  known_failure_modes:
  - missing_s1_filters
  - threshold_overclaim
  - missing_before_after_windows
  validation_implications:
  - Warn when Sentinel-1 flood workflows omit IW mode, polarization, before/after windows, or an explicit change metric.
  - Do not route flood mapping to NDVI product-intercomparison rules unless the user explicitly asks for vegetation products.
  planner_hints:
  - Route flood mapping to the Sentinel-1 before/after recipe and include SAR caveats, threshold review, and export artifact expectations.
  validator_hints:
  - Check Sentinel-1 scripts for COPERNICUS/S1_GRD, IW mode, polarization, before/after date windows, AOI filtering, and change metric.
  citation: Earth Engine Data Catalog COPERNICUS/S1_GRD and local Sentinel-1 flood recipe, checked 2026-07-09.
  last_checked: '2026-07-09'
  reviewer_status: accepted
  confidence: high
  private_content_risk: low
