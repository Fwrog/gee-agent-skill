- card_id: reduce_resolution_projection_rule
  title: reduceResolution projection handling required
  source_id: google-earth-engine-resample-guide
  source_url: https://developers.google.com/earth-engine/guides/resample
  source_type: official_docs
  trust_tier: A
  allowed_use: summary_only
  topics:
  - reduceResolution
  - projection
  - scale
  - validator_rule
  extracted_facts:
  - Cross-scale comparison needs explicit aggregation and projection handling to avoid accidental native-pixel comparison.
  extracted_patterns:
  - Pair reduceResolution or equivalent aggregation with reviewed projection/default-projection handling.
  limitations:
  - Projection handling makes comparison coherent but cannot remove sensor/product differences.
  claim_boundaries:
  - Aggregated product comparison remains product-level consistency evidence.
  applicable_workflows:
  - product_intercomparison
  applicable_datasets:
