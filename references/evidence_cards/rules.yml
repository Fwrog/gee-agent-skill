- card_id: claim_boundary_required_for_validation_report
  title: Claim boundary required for validation reports
  source_id: google-earth-engine-docs
  source_url: https://developers.google.com/earth-engine
  source_type: official_docs
  trust_tier: A
  allowed_use: summary_only
  topics:
  - claim_boundary
  - validation_report
  - overclaim_prevention
  extracted_facts:
  - A validation report should identify what its evidence supports and what it cannot claim.
  extracted_patterns:
  - Product intercomparison reports should state product-level consistency rather than in-situ ground-truth accuracy.
  limitations:
  - Claim boundaries are conservative policy controls, not statistical guarantees.
  claim_boundaries:
  - Validation reports without explicit claim boundaries should not be promoted.
  applicable_workflows:
