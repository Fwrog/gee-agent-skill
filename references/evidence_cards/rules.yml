cards:
- card_id: modis_ndvi_scale_factor_rule
  title: MODIS NDVI scale factor required
  source_id: gee-catalog-mod13q1
  source_url: https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MOD13Q1
  source_type: official_data_catalog
  trust_tier: A
  allowed_use: summary_only
  topics:
  - MODIS
  - NDVI
  - scale_factor
  - validator_rule
  extracted_facts:
  - MODIS vegetation-index values must be interpreted with the documented 0.0001 scale factor.
  extracted_patterns:
  - Apply scale factors before metrics, exports, charts, or product intercomparison.
  limitations:
  - Scale factors do not resolve QA, temporal, projection, or mixed-pixel differences.
  claim_boundaries:
  - Quantitative agreement cannot be claimed if the MODIS scale factor is missing.
  applicable_workflows:
  - product_intercomparison
  - vegetation_index
  - annual_endmember_transition
  applicable_datasets:
  - MODIS/061/MOD13Q1
  applicable_operators: []
  known_failure_modes:
  - missing_modis_scale_factor
  validation_implications:
  - Fail or warn when MOD13Q1 NDVI/EVI appears without 0.0001.
  planner_hints:
  - State the MODIS scale factor in plan methods.
  validator_hints:
  - Look for literal 0.0001 or equivalent scale-factor constant.
  citation: Earth Engine Data Catalog MODIS/061/MOD13Q1, checked 2026-07-09.
