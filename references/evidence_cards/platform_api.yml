- card_id: earth_engine_deferred_execution
  title: Earth Engine deferred execution
  source_id: google-earth-engine-docs
  source_url: https://developers.google.com/earth-engine
  source_type: official_docs
  trust_tier: A
  allowed_use: summary_only
  topics:
  - deferred_execution
  - server_side
  extracted_facts:
  - Earth Engine objects often represent deferred server-side computations until evaluated or exported.
  extracted_patterns:
  - Validate graph construction and export contracts before triggering live computation.
  limitations:
  - Deferred execution means static validation cannot guarantee live data availability.
  claim_boundaries:
  - Deferred execution guidance supports execution safety only.
  applicable_workflows:
  - validate
  - preflight
  - run
  applicable_datasets: []
  applicable_operators:
  - ee.Image
  - ee.ImageCollection
  - Export
  known_failure_modes:
  - late_runtime_failure
  - empty_collection
  validation_implications:
  - Static validation should be paired with preflight for live workflows.
  planner_hints:
  - Include preflight and trace steps before export.
  validator_hints:
  - Avoid claiming live success from rendered code alone.
  citation: Earth Engine deferred execution guide, checked 2026-07-09.
