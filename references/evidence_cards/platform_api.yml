- card_id: earth_engine_reduce_resolution
  title: Earth Engine reduceResolution behavior
  source_id: google-earth-engine-resample-guide
  source_url: https://developers.google.com/earth-engine/guides/resample
  source_type: official_docs
  trust_tier: A
  allowed_use: summary_only
  topics:
  - reduceResolution
  - aggregation
  - projection
  extracted_facts:
  - Fine-resolution products should be aggregated before coherent comparison with coarser products.
  extracted_patterns:
  - Pair reduceResolution with explicit projection handling for product intercomparison.
  limitations:
  - Aggregation cannot eliminate temporal, sensor, or mixed-pixel differences.
  claim_boundaries:
  - Aggregated product comparison supports product consistency, not in-situ validation.
  applicable_workflows:
  - product_intercomparison
  applicable_datasets: []
  applicable_operators:
  - reduceResolution
  - reproject
  known_failure_modes:
  - reduce_resolution_projection_missing
  - direct_fine_coarse_pixel_comparison
  validation_implications:
  - Warn when reduceResolution lacks projection/default projection handling.
  planner_hints:
  - Add aggregation-before-comparison as an explicit step.
  validator_hints:
  - Look for reduceResolution paired with projection handling.
