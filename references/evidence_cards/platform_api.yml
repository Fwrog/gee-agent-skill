  - projection
  - reducers
  extracted_facts:
  - Earth Engine scale/projection choices affect reducers, exports, and cross-product comparisons.
  extracted_patterns:
  - Make scale and CRS/projection choices explicit in generated plans and scripts.
  limitations:
  - Explicit scale/projection reduces ambiguity but does not remove sensor/product differences.
  claim_boundaries:
  - Scale/projection controls support reproducibility, not ground-truth accuracy.
