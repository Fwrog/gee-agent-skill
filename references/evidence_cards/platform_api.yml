cards:
- card_id: earth_engine_python_api
  title: Earth Engine Python API execution surface
  source_id: google-earth-engine-api-reference
  source_url: https://developers.google.com/earth-engine/apidocs
  source_type: official_api_reference
  trust_tier: A
  allowed_use: summary_only
  topics:
  - api
  - python
  - execution_boundary
  extracted_facts:
  - The Python API is the reviewed execution surface for generated Earth Engine workflows in this harness.
  extracted_patterns:
  - Keep authentication, project selection, validation, preflight, and live execution in the CLI control plane.
  limitations:
  - API availability does not imply user credentials, quota, or scientific validity.
  claim_boundaries:
  - Python API facts support execution mechanics only.
  applicable_workflows:
  - render
  - validate
  - preflight
  - run
  applicable_datasets: []
  applicable_operators:
  - ee.Initialize
  - ee.ImageCollection
  - Export
  known_failure_modes:
  - inline_authentication
  - live_export_without_confirmation
  validation_implications:
  - Generated scripts must not bypass CLI-controlled authentication and confirmation gates.
  planner_hints:
  - Plan generated code as reviewable Python API scripts.
  validator_hints:
  - Flag inline authentication or live task starts outside guarded paths.
  citation: Earth Engine API reference, checked 2026-07-09.
  last_checked: '2026-07-09'
  reviewer_status: accepted
  confidence: high
  private_content_risk: low
