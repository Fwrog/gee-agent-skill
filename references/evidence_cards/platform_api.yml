- card_id: earth_engine_client_vs_server
  title: Earth Engine client/server boundary
  source_id: google-earth-engine-docs
  source_url: https://developers.google.com/earth-engine
  source_type: official_docs
  trust_tier: A
  allowed_use: summary_only
  topics:
  - client_server
  - deferred_execution
  - getInfo
  extracted_facts:
  - Earth Engine workflows should avoid unbounded client-side materialization of server-side objects.
  extracted_patterns:
  - Prefer server-side reducers, exports, metadata properties, and bounded preflight probes.
  limitations:
  - Client/server discipline does not by itself prove dataset correctness.
  claim_boundaries:
  - Client/server rules support runtime safety, not scientific truth.
  applicable_workflows:
  - validation
  - run
  - trace
  applicable_datasets: []
  applicable_operators:
  - getInfo
  - evaluate
  - reduceRegion
  - Export
  known_failure_modes:
  - unsafe_getinfo
  - client_side_iteration
  validation_implications:
  - Warn on unsafe getInfo in generated workflows.
  planner_hints:
  - Keep expensive computation server-side and export reviewable artifacts.
  validator_hints:
  - Flag unbounded client fetches.
  citation: Earth Engine client/server guide, checked 2026-07-09.
  last_checked: '2026-07-09'
  reviewer_status: accepted
  confidence: high
  private_content_risk: low
