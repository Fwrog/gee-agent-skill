- card_id: earth_engine_export_image
  title: Earth Engine image export behavior
  source_id: google-earth-engine-docs
  source_url: https://developers.google.com/earth-engine
  source_type: official_docs
  trust_tier: A
  allowed_use: summary_only
  topics:
  - export
  - image
  - geotiff
  extracted_facts:
  - Image exports require explicit review of region, scale, CRS, maxPixels, dtype, and destination.
  extracted_patterns:
  - Use deterministic tiling when full-region raster exports exceed memory or quota.
  limitations:
  - A submitted task is not completed evidence until monitored and read back.
  claim_boundaries:
  - Export completion supports engineering evidence, not scientific truth by itself.
  applicable_workflows:
  - export
  - monitor
  - trace
  applicable_datasets: []
  applicable_operators:
  - Export.image.toDrive
  known_failure_modes:
  - quota_or_timeout
  - mixed_dtype_export
  - missing_readback
  validation_implications:
  - Check image exports for region, scale, CRS, maxPixels, and dtype stability.
  planner_hints:
  - Include export artifact expectations and fallback tiling.
  validator_hints:
  - Flag incomplete image export contracts.
