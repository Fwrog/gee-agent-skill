    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [water, coastal, surface_water]
    extracted_facts:
      - JRC Global Surface Water is an official Earth Engine catalog source for surface-water context.
    extracted_patterns:
      - Use water context to interpret low NDVI or mixed coastal pixels.
    limitations:
      - Water occurrence context does not prove field conditions for a specific date.
    claim_boundaries:
      - Water masks support interpretation only.
    applicable_workflows: [validation, product_intercomparison, water_index]
    applicable_datasets: [JRC/GSW1_4/GlobalSurfaceWater]
    applicable_operators: [updateMask]
    known_failure_modes: [coastal_mixed_pixel_overclaim]
    validation_implications:
      - Coastal/mixed-pixel differences should be described as expected product differences where appropriate.
    planner_hints:
      - Consider water context for coastal AOIs.
    validator_hints:
      - Check reports for coastal/mixed-pixel caveats.
    citation: Earth Engine Data Catalog JRC Global Surface Water, checked 2026-07-09.
