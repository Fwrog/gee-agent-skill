cards:
  - card_id: sentinel2_sr_harmonized
    title: Sentinel-2 SR Harmonized dataset card
    source_id: gee-catalog-sentinel2-sr-harmonized
    source_url: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_S2_SR_HARMONIZED
    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [Sentinel-2, optical, NDVI, QA]
    extracted_facts:
      - COPERNICUS/S2_SR_HARMONIZED is the official Earth Engine dataset ID for harmonized Sentinel-2 surface reflectance.
    extracted_patterns:
      - Use explicit cloud/QA masking and scale choices for optical index workflows.
    limitations:
      - Optical workflows are sensitive to clouds, haze, shadows, and band-resolution choices.
    claim_boundaries:
      - Sentinel-2 derived indices are product outputs, not field validation.
    applicable_workflows: [vegetation_index, water_index, builtup_index, zonal_statistics]
    applicable_datasets: [COPERNICUS/S2_SR_HARMONIZED]
    applicable_operators: [normalizedDifference, updateMask]
    known_failure_modes: [missing_cloud_mask, empty_collection]
    validation_implications:
      - Optical workflows need cloud/QA masking and explicit scale.
    planner_hints:
      - Include SCL/QA/cloud policy for Sentinel-2 plans.
    validator_hints:
      - Check for SCL, QA60, cloud, or equivalent masking.
    citation: Earth Engine Data Catalog COPERNICUS/S2_SR_HARMONIZED, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
  - card_id: landsat_collection2_sr
    title: Landsat Collection 2 Level 2 dataset card
    source_id: gee-catalog-landsat-lc08-c2-l2
    source_url: https://developers.google.com/earth-engine/datasets/catalog/LANDSAT_LC08_C02_T1_L2
    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [Landsat, surface_reflectance, LST, QA]
    extracted_facts:
      - Landsat Collection 2 Level 2 products require reviewed scale/offset and QA policies before physical interpretation.
    extracted_patterns:
      - Use QA_PIXEL and documented scale/offset for SR/LST workflows.
    limitations:
      - Landsat products are not automatic ground truth for other sensors.
    claim_boundaries:
      - Cross-sensor checks support product consistency only.
    applicable_workflows: [vegetation_index, land_surface_temperature, product_intercomparison]
    applicable_datasets: [LANDSAT/LC08/C02/T1_L2]
    applicable_operators: [updateMask, expression]
    known_failure_modes: [missing_landsat_scale_offset, missing_qa_pixel]
    validation_implications:
      - LST and SR scripts need documented scale/offset and QA_PIXEL masking.
    planner_hints:
      - State Landsat scale/offset and QA policy.
    validator_hints:
      - Check for QA_PIXEL and Collection 2 scale/offset constants.
    citation: Earth Engine Data Catalog LANDSAT/LC08/C02/T1_L2, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
  - card_id: sentinel1_grd
    title: Sentinel-1 GRD dataset card
    source_id: gee-catalog-sentinel1-grd
    source_url: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_S1_GRD
    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [Sentinel-1, SAR, flood, change_detection]
    extracted_facts:
      - COPERNICUS/S1_GRD is the official Earth Engine dataset ID for Sentinel-1 GRD SAR workflows.
    extracted_patterns:
      - Filter by mode, polarization, orbit, date windows, and AOI before flood/change metrics.
    limitations:
      - SAR flood workflows need caveats for speckle, incidence angle, polarization, and threshold choice.
    claim_boundaries:
      - SAR change maps are screening products unless validated with independent evidence.
    applicable_workflows: [flood_mapping, change_detection]
    applicable_datasets: [COPERNICUS/S1_GRD]
    applicable_operators: [filter, divide, subtract]
    known_failure_modes: [missing_s1_filters, threshold_overclaim]
    validation_implications:
      - Sentinel-1 flood workflows need mode/polarization/date filters and explicit change metric.
    planner_hints:
      - Include before/after windows and SAR caveats.
    validator_hints:
      - Check for IW mode, polarization, before/after windows, and change metric.
    citation: Earth Engine Data Catalog COPERNICUS/S1_GRD, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
  - card_id: dynamic_world
    title: Dynamic World V1 dataset card
    source_id: gee-catalog-dynamic-world-v1
    source_url: https://developers.google.com/earth-engine/datasets/catalog/GOOGLE_DYNAMICWORLD_V1
    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [Dynamic_World, landcover, interpretation_mask]
    extracted_facts:
      - Dynamic World is a probabilistic land-cover product available in Earth Engine.
    extracted_patterns:
      - Use Dynamic World as an interpretation mask or strata with confidence thresholds.
    limitations:
      - Dynamic World is not independent ground truth for Sentinel-2-derived vegetation claims.
    claim_boundaries:
      - Land-cover-aware outputs must describe Dynamic World as interpretation context.
    applicable_workflows: [landcover_stratified_statistics, vegetation_index]
    applicable_datasets: [GOOGLE/DYNAMICWORLD/V1]
    applicable_operators: [updateMask, reduceRegions]
    known_failure_modes: [ground_truth_overclaim, missing_probability_threshold]
    validation_implications:
      - Land-cover workflows need threshold and class-fraction fields.
    planner_hints:
      - Include interpretation-mask caveats for Dynamic World.
    validator_hints:
      - Check for label/probability bands and threshold handling.
    citation: Earth Engine Data Catalog GOOGLE/DYNAMICWORLD/V1, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
