    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [VIIRS, NDVI, product_intercomparison]
    extracted_facts:
      - VNP13A1 is an official Earth Engine VIIRS vegetation-index product.
    extracted_patterns:
      - Use VIIRS as an optional coarse product consistency check only after primary MODIS logic is stable.
    limitations:
      - VIIRS 500 m products are coarser than HLS and MODIS MOD13Q1.
    claim_boundaries:
      - VIIRS comparison supports product-level consistency only.
    applicable_workflows: [vegetation_index, product_intercomparison]
    applicable_datasets: [NASA/VIIRS/002/VNP13A1]
    applicable_operators: [select, updateMask]
    known_failure_modes: [direct_fine_coarse_pixel_comparison]
    validation_implications:
      - Compare at VIIRS grid or coarser summaries, not direct fine pixels.
    planner_hints:
      - Keep VIIRS optional unless source and QA behavior are reviewed for the AOI/year.
    validator_hints:
      - Check VIIRS comparisons for scale and QA caveats.
