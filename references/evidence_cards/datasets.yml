- card_id: landscan_global_community
  title: LandScan Global community asset dataset card
  source_id: gee-community-catalog-landscan-global
  source_url: https://developers.google.com/earth-engine/datasets/catalog/projects_sat-io_open-datasets_ORNL_LANDSCAN_GLOBAL
  source_type: community_docs
  trust_tier: B
  allowed_use: summary_only
  topics:
  - LandScan
  - population_count
  - annual
  - community_asset
  extracted_facts:
  - projects/sat-io/open-datasets/ORNL/LANDSCAN_GLOBAL is directly callable as an ee.ImageCollection.
  - Band b1 stores estimated population counts at approximately 30 arc-seconds / 1 km.
  - The catalog states CC BY 4.0 attribution terms and explicitly says the community asset is not managed by Google Earth Engine.
  extracted_patterns:
  - Filter by each expected year, verify exactly one reviewed annual image and band b1, convert counts to density, aggregate density to the target equal-area grid, and multiply by target pixel area.
  limitations:
  - Catalog prose and live collection metadata can differ; a 2026-07-25 live check exposed 2024 while the catalog availability text ended in 2023.
  - LandScan is a modeled ambient-population estimate, not a census-cell ground truth.
  claim_boundaries:
  - Direct public availability does not remove the need for annual coverage, population-conservation, license, and attribution checks.
  applicable_workflows:
  - annual_endmember_transition
  - change_detection
  - zonal_statistics
  applicable_datasets:
  - projects/sat-io/open-datasets/ORNL/LANDSCAN_GLOBAL
  applicable_operators:
  - filterDate
  - select
  - pixelArea
  - reduceResolution
  known_failure_modes:
  - annual_coverage_gap
  - count_resampling_unsafe
  - community_asset_metadata_drift
  validation_implications:
  - Require explicit expected years, expected band b1, system time metadata, density conversion, target grid, and a population-conservation audit.
  planner_hints:
  - Mark the asset as community-managed, record CC BY 4.0 attribution, and keep catalog-status metadata separate from live asset observations.
  validator_hints:
  - Flag direct interpolation or averaging of b1 counts and missing community-asset metadata contracts.
  citation: Earth Engine Community Data Catalog LandScan Global entry, checked 2026-07-25.
