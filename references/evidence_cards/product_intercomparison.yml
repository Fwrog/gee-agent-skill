cards:
  - card_id: modis_mod13q1_ndvi
    title: MOD13Q1 NDVI official product card
    source_id: gee-catalog-mod13q1
    source_url: https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MOD13Q1
    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [MODIS, MOD13Q1, NDVI, QA, scale_factor]
    extracted_facts:
      - MOD13Q1 is the Earth Engine dataset ID used for Terra 16-day 250 m vegetation indices.
      - NDVI and EVI values require the documented 0.0001 scale factor before quantitative interpretation.
      - SummaryQA and DetailedQA are required QA fields for reviewed product intercomparison.
    extracted_patterns:
      - Compare MODIS vegetation-index products at their product grid or coarser aggregate scale.
    limitations:
      - MOD13Q1 is a coarse official product and cannot validate 30 m pixel-level edges.
      - Product intercomparison is not in-situ accuracy assessment.
    claim_boundaries:
      - Supports product-level consistency claims only after scale, QA, temporal matching, and aggregation are documented.
    applicable_workflows: [vegetation_index, product_intercomparison, validation]
    applicable_datasets: [MODIS/061/MOD13Q1]
    applicable_operators: [ee.ImageCollection, reduceResolution, reproject]
    known_failure_modes: [missing_modis_scale_factor, missing_modis_qa, direct_fine_coarse_pixel_comparison]
    validation_implications:
      - Fail or warn when MODIS NDVI/EVI is interpreted without multiplying by 0.0001.
      - Warn when SummaryQA or DetailedQA is absent from MODIS product-intercomparison code.
    planner_hints:
      - Apply MODIS scale factor and QA before exporting or calculating agreement metrics.
    validator_hints:
      - Look for a 0.0001 scale factor and SummaryQA or DetailedQA when MOD13Q1 is used.
    citation: Earth Engine Data Catalog MODIS/061/MOD13Q1, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
  - card_id: hls_hlsl30
    title: HLSL30 official high-resolution source card
    source_id: gee-catalog-hlsl30
    source_url: https://developers.google.com/earth-engine/datasets/catalog/NASA_HLS_HLSL30_v002
    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [HLS, HLSL30, Landsat, Fmask, NDVI]
    extracted_facts:
      - HLSL30 is the Earth Engine dataset ID for NASA HLS Landsat observations at 30 m.
      - HLSL30 workflows need an Fmask policy before NDVI product intercomparison.
    extracted_patterns:
      - Use HLSL30 as one high-resolution input that must be QA-screened and aggregated before MODIS comparison.
    limitations:
      - HLSL30 is not an independent ground-truth reference.
    claim_boundaries:
      - Supports high-resolution product construction, not ground-truth accuracy.
    applicable_workflows: [vegetation_index, product_intercomparison]
    applicable_datasets: [NASA/HLS/HLSL30/v002]
    applicable_operators: [ee.ImageCollection, updateMask, normalizedDifference]
    known_failure_modes: [missing_hls_fmask, direct_fine_coarse_pixel_comparison]
    validation_implications:
      - Warn when HLS product-intercomparison code omits Fmask or an equivalent QA policy.
    planner_hints:
      - Include Fmask screening and aggregation to the comparison product grid.
    validator_hints:
      - Check HLS scripts for Fmask or explicit QA masking.
    citation: Earth Engine Data Catalog NASA/HLS/HLSL30/v002, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
