  - card_id: scale_aware_product_intercomparison_rule
    title: Scale-aware HLS/MODIS product intercomparison rule
    source_id: google-earth-engine-data-catalog
    source_url: https://developers.google.com/earth-engine/datasets
    source_type: official_data_catalog
    trust_tier: A
    allowed_use: summary_only
    topics: [product_intercomparison, scale, projection, aggregation, claim_boundary]
    extracted_facts:
      - High-resolution HLS and coarser MODIS products must not be compared as direct native pixels.
      - Comparison requires temporal matching, QA filtering, scale factors, projection handling, and aggregation to a common grid.
    extracted_patterns:
      - Aggregate fine product values to the coarse product grid before computing agreement metrics.
    limitations:
      - Agreement metrics support workflow reliability, not in-situ ground-truth accuracy.
    claim_boundaries:
      - The strongest allowed claim is product-level consistency unless independent ground truth is added.
    applicable_workflows: [product_intercomparison, validation]
    applicable_datasets: [NASA/HLS/HLSL30/v002, NASA/HLS/HLSS30/v002, MODIS/061/MOD13Q1]
    applicable_operators: [reduceResolution, reproject, setDefaultProjection]
    known_failure_modes: [direct_fine_coarse_pixel_comparison, reduce_resolution_projection_missing]
    validation_implications:
      - Warn or fail when 30 m and 250 m products are compared without aggregation/projection handling.
    planner_hints:
      - State temporal matching, QA policies, scale factor, aggregation-before-comparison, metrics, and claim boundary.
    validator_hints:
      - Require explicit projection/scale logic when reduceResolution is used for coarse-grid comparison.
    citation: Earth Engine official catalog and scale/projection guidance, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
  - card_id: direct_fine_coarse_comparison_failure_case
    title: Direct fine/coarse pixel comparison failure case
    source_id: google-earth-engine-docs
    source_url: https://developers.google.com/earth-engine/guides/reducers_reduce_resolution
    source_type: official_docs
    trust_tier: A
    allowed_use: summary_only
    topics: [failure_case, scale, projection, reduceResolution]
    extracted_facts:
      - Direct comparison between 30 m and 250 m pixels confounds resolution, projection, mixed pixels, and product design.
    extracted_patterns:
      - Recover by aggregating fine-resolution data to the comparison product grid with explicit projection and QA.
    limitations:
      - Aggregation reduces but does not remove sensor, BRDF, cloud, temporal, and mixed-pixel differences.
    claim_boundaries:
      - A repaired comparison can support product-level consistency, not ground-truth validation.
    applicable_workflows: [product_intercomparison, validation]
    applicable_datasets: [NASA/HLS/HLSL30/v002, NASA/HLS/HLSS30/v002, MODIS/061/MOD13Q1]
    applicable_operators: [reduceResolution, reproject]
    known_failure_modes: [direct_fine_coarse_pixel_comparison]
    validation_implications:
      - Flag native-resolution HLS/MODIS pixel comparisons as unsafe.
    planner_hints:
      - Add aggregation and projection matching before metrics.
    validator_hints:
      - Check for reduceResolution/reproject or an equivalent coarse-grid aggregation step.
    citation: Earth Engine reduceResolution guidance and official dataset catalog facts, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
  - card_id: product_intercomparison_claim_boundary
    title: Product intercomparison claim boundary
    source_id: google-earth-engine-docs
    source_url: https://developers.google.com/earth-engine
    source_type: official_docs
    trust_tier: A
    allowed_use: summary_only
    topics: [claim_boundary, validation, golden]
    extracted_facts:
      - A public Golden demo requires traceable source choices, task evidence, readback, analysis, tests, and explicit limitations.
    extracted_patterns:
      - Validation reports should state what the evidence supports and what it cannot claim.
    limitations:
      - Product intercomparison can be reproducible and useful without proving ground-truth accuracy.
    claim_boundaries:
      - Do not describe product intercomparison as in-situ ground-truth validation.
    applicable_workflows: [validation, product_intercomparison, golden_promotion]
    applicable_datasets: []
    applicable_operators: []
    known_failure_modes: [ground_truth_overclaim, golden_without_readback]
    validation_implications:
      - Flag validation reports or Golden promotion without explicit claim boundary.
    planner_hints:
      - Include public evidence artifacts and claim boundary in plan outputs.
    validator_hints:
      - Check for product-level consistency wording and absence of ground-truth overclaim.
    citation: Earth Engine platform docs plus project public promotion policy, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: high
    private_content_risk: low
  - card_id: tiled_export_fallback_recovery
    title: Tiled export fallback recovery pattern
    source_id: google-earth-engine-docs
    source_url: https://developers.google.com/earth-engine/guides/exporting_images
    source_type: official_docs
    trust_tier: A
    allowed_use: summary_only
    topics: [export, recovery_pattern, tiling, quota]
    extracted_facts:
      - Large raster exports can need explicit scale, CRS, maxPixels, and smaller export regions.
    extracted_patterns:
      - Recover from memory or quota pressure by deterministic tiling with traceable task metadata.
    limitations:
      - Tiling changes export orchestration, not underlying product validity.
    claim_boundaries:
      - Tiled readback supports engineering completion evidence when documented and tested.
    applicable_workflows: [export, monitor, validation]
    applicable_datasets: []
    applicable_operators: [Export.image.toDrive]
    known_failure_modes: [quota_or_timeout, out_of_memory_export, missing_readback]
    validation_implications:
      - Golden promotion needs observed terminal tasks and readback evidence, including fallback tiles when used.
    planner_hints:
      - Include a deterministic tiled fallback for large annual rasters.
    validator_hints:
      - Check export contracts for scale, CRS, maxPixels, and task/readback trace fields.
    citation: Earth Engine image export guidance, checked 2026-07-09.
    last_checked: "2026-07-09"
    reviewer_status: accepted
    confidence: medium
    private_content_risk: low
